name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Bash syntax + extract tests
        run: bash tests/installer_static_checks.sh

  security-grep:
    name: Security greps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Forbidden patterns
        run: |
          set -e
          ! grep -n 'subj "/CN=www.google.com"' install.sh
          ! grep -n 'pkill -KILL -x stunnel4' install.sh
          ! grep -n 'installing zip anyway' install.sh
          ! grep -n 'echo "admin / $NEWPASS" > /etc/tunnel/panel-login.txt' install.sh
          grep -n 'SHA256 missing or mismatched' install.sh
          grep -n 'Max-Age=0' install.sh
          echo "security greps OK"
